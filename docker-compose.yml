version: '3.8'

services:
  # Layanan Backend FastAPI
  backend:
    build: .
    container_name: kickdiary_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://kickdiary_user:kickdiary_pass@db:5432/kickdiary_db
      - SECRET_KEY=kickdiary_secret_jwt_key_2026_ippl_secure_super_safe
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
    depends_on:
      - db
    restart: always

  # Layanan Database PostgreSQL (Sesuai SDD: PostgreSQL versi 14+)
  db:
    image: postgres:15-alpine
    container_name: kickdiary_postgres
    environment:
      POSTGRES_USER: kickdiary_user
      POSTGRES_PASSWORD: kickdiary_pass
      POSTGRES_DB: kickdiary_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
